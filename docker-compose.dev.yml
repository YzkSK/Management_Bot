name: management-bot-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: management_bot
      POSTGRES_PASSWORD: management_bot
      POSTGRES_DB: management_bot
    # ステータス画面のログ表示用(issue #507)。PGDATA/log/配下へ曜日ごとに上書きローテーションで書き、vectorが読む。
    command:
      - postgres
      - -c
      - logging_collector=on
      - -c
      - log_filename=postgresql-%a.log
      - -c
      - log_truncate_on_rotation=on
      - -c
      - log_rotation_age=1d
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U management_bot -d management_bot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # ステータス画面のログ表示用(issue #507)。ponytail: redis.logはローテーションしない(出力が少ないため)。肥大化したらlogrotateを足す。
    command: redis-server --appendonly yes --logfile /data/redis.log
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  vector:
    image: timberio/vector:0.46.1-alpine
    restart: unless-stopped
    volumes:
      - ./vector.yaml:/etc/vector/vector.yaml:ro
      - postgres-data:/logs/postgres:ro
      - redis-data:/logs/redis:ro
    depends_on:
      redis:
        condition: service_healthy

  # ステータス画面のリソース表示用(issue #548)。portsは公開せず、dashboard-apiがcompose内部から参照する。
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    command:
      - --housekeeping_interval=5s
      - --docker_only=true
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service
      - --disable_metrics=percpu,sched,tcp,udp,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl,process
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  migrate:
    build:
      context: .
      dockerfile: apps/dashboard-api/Dockerfile
    command: ["bun", "run", "--cwd", "/repo/packages/db", "db:migrate"]
    env_file: .env.dev
    environment:
      DATABASE_URL: postgres://management_bot:management_bot@postgres:5432/management_bot
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    restart: unless-stopped
    env_file: .env.dev
    environment:
      DATABASE_URL: postgres://management_bot:management_bot@postgres:5432/management_bot
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  dashboard-api:
    build:
      context: .
      dockerfile: apps/dashboard-api/Dockerfile
    restart: unless-stopped
    env_file: .env.dev
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://management_bot:management_bot@postgres:5432/management_bot
      REDIS_URL: redis://redis:6379
      DASHBOARD_WEB_URL: http://localhost:8080
      DISCORD_OAUTH_REDIRECT_URI: http://localhost:3000/auth/callback
      CADVISOR_URL: http://cadvisor:8080
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  backup:
    build:
      context: .
      dockerfile: apps/backup/Dockerfile
    restart: unless-stopped
    env_file: .env.dev
    environment:
      DATABASE_URL: postgres://management_bot:management_bot@postgres:5432/management_bot
      REDIS_URL: redis://redis:6379
    volumes:
      - backup-data:/backups
    depends_on:
      postgres:
        condition: service_healthy

  logging-retention:
    build:
      context: .
      dockerfile: apps/logging-retention/Dockerfile
    restart: unless-stopped
    env_file: .env.dev
    environment:
      DATABASE_URL: postgres://management_bot:management_bot@postgres:5432/management_bot
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully

  moderation-decay:
    build:
      context: .
      dockerfile: apps/moderation-decay/Dockerfile
    restart: unless-stopped
    env_file: .env.dev
    environment:
      DATABASE_URL: postgres://management_bot:management_bot@postgres:5432/management_bot
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully

  activity-rollup:
    build:
      context: .
      dockerfile: apps/activity-rollup/Dockerfile
    restart: unless-stopped
    env_file: .env.dev
    environment:
      DATABASE_URL: postgres://management_bot:management_bot@postgres:5432/management_bot
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully

  session-cleanup:
    build:
      context: .
      dockerfile: apps/session-cleanup/Dockerfile
    restart: unless-stopped
    env_file: .env.dev
    environment:
      DATABASE_URL: postgres://management_bot:management_bot@postgres:5432/management_bot
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully

  dashboard-web:
    build:
      context: .
      dockerfile: apps/dashboard-web/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - dashboard-api

volumes:
  postgres-data:
  redis-data:
  backup-data:
