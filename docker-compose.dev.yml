name: management-bot-dev

services:
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_USER: management_bot
      POSTGRES_PASSWORD: management_bot
      POSTGRES_DB: management_bot
    # ステータス画面のログ表示用(issue #507)。PGDATA/log/配下へ曜日ごとに上書きローテーションで書き、vectorが読む。
    # jsonlogは1エントリ1行(改行はエスケープ)のため、入力値の改行で偽のログ行を作られない(issue #568)。
    # ファイル名の拡張子は.logが.jsonに置き換わる。
    command:
      - postgres
      - -c
      - logging_collector=on
      - -c
      - log_destination=jsonlog
      - -c
      - log_filename=postgresql-%a.log
      - -c
      - log_truncate_on_rotation=on
      - -c
      - log_rotation_age=1d
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PG18以降はメジャーバージョン別サブディレクトリ(18/docker)に書くため親ディレクトリをマウントする(issue #608)。
      # 旧PG17のpostgres-dataボリュームはロールバック用に残す。
      - postgres18-data:/var/lib/postgresql
      # postgres-upgradeが置いたPG17のdump。PG18はデータディレクトリが空の初回起動時だけここの*.sqlを流す。
      - postgres-upgrade-dump:/docker-entrypoint-initdb.d:ro
    depends_on:
      postgres-upgrade:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U management_bot -d management_bot"]
      interval: 5s
      timeout: 3s
      retries: 20

  # PG17→18の自動データ移行(issue #608)。詳細はdocker-compose.ymlの同名サービスを参照。
  # ponytail: 全環境の移行完了後はこのサービスとpostgres-data/postgres-upgrade-dumpボリュームを削除する。
  postgres-upgrade:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: "no"
    volumes:
      - postgres-data:/old
      - postgres18-data:/new:ro
      - postgres-upgrade-dump:/dump
    command:
      - sh
      - -euc
      - |
        if [ ! -s /old/PG_VERSION ]; then echo "postgres-upgrade: skip (no PG17 data)"; exit 0; fi
        if [ -s /new/18/docker/PG_VERSION ]; then
          # 復元完了マーカーが無い=restoreが途中で失敗した。部分的なDBで起動させない。
          if [ ! -e /new/18/docker/.pg17-restored ]; then echo "postgres-upgrade: ERROR PG18 exists but PG17 restore did not complete; recreate postgres18-data volume" >&2; exit 1; fi
          # 移行後にPG17が起動された(ロールバック中の書き込みの可能性)。古いPG18で起動させない。
          if [ /old/global/pg_control -nt /new/18/docker/.pg17-restored ]; then echo "postgres-upgrade: ERROR PG17 data changed after migration (rollback?); migrate manually" >&2; exit 1; fi
          echo "postgres-upgrade: skip (already migrated)"; exit 0
        fi
        chown postgres /dump
        # initdb.dは辞書順に実行され、失敗時はそこで止まるため、SQLが全て成功した場合だけマーカーが作られる。
        echo 'touch "$$PGDATA/.pg17-restored"' > /dump/20-mark-restored.sh
        gosu postgres pg_ctl -D /old -w start -o "-c listen_addresses=''"
        gosu postgres pg_dump -U management_bot -d management_bot -f /dump/restore.tmp
        gosu postgres pg_ctl -D /old -w stop
        mv /dump/restore.tmp /dump/10-restore-pg17.sql
        echo "postgres-upgrade: dumped"

  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    restart: unless-stopped
    # ステータス画面のログ表示用(issue #507)。ponytail: redis.logはローテーションしない(出力が少ないため)。肥大化したらlogrotateを足す。
    command: redis-server --appendonly yes --logfile /data/redis.log
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  vector:
    image: timberio/vector:0.58.0-alpine@sha256:5dcf67db0ee378caa87f3395cb9484ebe3e97bb0334d119f2ac33116e00c5773
    restart: unless-stopped
    volumes:
      - ./vector.yaml:/etc/vector/vector.yaml:ro
      - postgres18-data:/logs/postgres:ro
      - redis-data:/logs/redis:ro
    environment:
      VECTOR_REDIS_ENDPOINT: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  # ステータス画面のリソース表示用(issue #548)。ホスト全体の値だけを取る(コンテナ別はcontainerdイメージストアで認識できないためdocker-proxy経由)。
  # portsは公開せず、dashboard-apiがcompose内部から参照する。
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6@sha256:b8e7d1093144fd088f425ff003d75a4aa405de075db78dae3bc563730b1bd07a
    restart: unless-stopped
    command:
      - --housekeeping_interval=5s
      - --disable_metrics=percpu,sched,tcp,udp,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl,process
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /dev/disk/:/dev/disk:ro

  # ステータス画面のコンテナ別リソース表示用(issue #548)。コンテナ情報の読み取りだけを許可する。
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    restart: unless-stopped
    environment:
      CONTAINERS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  migrate:
    build:
      context: .
      dockerfile: apps/dashboard-api/Dockerfile
    command: ["bun", "run", "--cwd", "/repo/packages/db", "db:migrate"]
    env_file: .env.dev
    environment:
      DATABASE_URL: postgres://management_bot:management_bot@postgres:5432/management_bot
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    restart: unless-stopped
    env_file: .env.dev
    environment:
      DATABASE_URL: postgres://management_bot:management_bot@postgres:5432/management_bot
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  dashboard-api:
    build:
      context: .
      dockerfile: apps/dashboard-api/Dockerfile
    restart: unless-stopped
    env_file: .env.dev
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://management_bot:management_bot@postgres:5432/management_bot
      REDIS_URL: redis://redis:6379
      DASHBOARD_WEB_URL: http://localhost:8080
      DISCORD_OAUTH_REDIRECT_URI: http://localhost:3000/auth/callback
      CADVISOR_URL: http://cadvisor:8080
      DOCKER_API_URL: http://docker-proxy:2375
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # backupイメージの非root化(issue #553)前に作られた既存ボリュームはroot所有のため、起動前に所有者を揃える。
  backup-volume-init:
    build:
      context: .
      dockerfile: apps/backup/Dockerfile
    user: "0"
    command: ["chown", "-R", "bun:bun", "/backups"]
    volumes:
      - backup-data:/backups
    restart: "no"

  backup:
    build:
      context: .
      dockerfile: apps/backup/Dockerfile
    restart: unless-stopped
    env_file: .env.dev
    environment:
      DATABASE_URL: postgres://management_bot:management_bot@postgres:5432/management_bot
      REDIS_URL: redis://redis:6379
    volumes:
      - backup-data:/backups
    depends_on:
      postgres:
        condition: service_healthy
      backup-volume-init:
        condition: service_completed_successfully

  logging-retention:
    build:
      context: .
      dockerfile: apps/logging-retention/Dockerfile
    restart: unless-stopped
    env_file: .env.dev
    environment:
      DATABASE_URL: postgres://management_bot:management_bot@postgres:5432/management_bot
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully

  moderation-decay:
    build:
      context: .
      dockerfile: apps/moderation-decay/Dockerfile
    restart: unless-stopped
    env_file: .env.dev
    environment:
      DATABASE_URL: postgres://management_bot:management_bot@postgres:5432/management_bot
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully

  activity-rollup:
    build:
      context: .
      dockerfile: apps/activity-rollup/Dockerfile
    restart: unless-stopped
    env_file: .env.dev
    environment:
      DATABASE_URL: postgres://management_bot:management_bot@postgres:5432/management_bot
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully

  session-cleanup:
    build:
      context: .
      dockerfile: apps/session-cleanup/Dockerfile
    restart: unless-stopped
    env_file: .env.dev
    environment:
      DATABASE_URL: postgres://management_bot:management_bot@postgres:5432/management_bot
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully

  dashboard-web:
    build:
      context: .
      dockerfile: apps/dashboard-web/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - dashboard-api

volumes:
  postgres-data:
  postgres18-data:
  postgres-upgrade-dump:
  redis-data:
  backup-data:
