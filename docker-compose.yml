services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: management_bot
      POSTGRES_PASSWORD: management_bot
      POSTGRES_DB: management_bot
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U management_bot -d management_bot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: apps/dashboard-api/Dockerfile
    command: ["bun", "run", "--cwd", "/repo/packages/db", "db:migrate"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://management_bot:management_bot@postgres:5432/management_bot
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://management_bot:management_bot@postgres:5432/management_bot
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  dashboard-api:
    build:
      context: .
      dockerfile: apps/dashboard-api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://management_bot:management_bot@postgres:5432/management_bot
      REDIS_URL: redis://redis:6379
      DASHBOARD_WEB_URL: ${DASHBOARD_WEB_URL}
      DISCORD_OAUTH_REDIRECT_URI: ${DISCORD_OAUTH_REDIRECT_URI}
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  backup:
    build:
      context: .
      dockerfile: apps/backup/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://management_bot:management_bot@postgres:5432/management_bot
    volumes:
      - backup-data:/backups
    depends_on:
      postgres:
        condition: service_healthy

  logging-retention:
    build:
      context: .
      dockerfile: apps/logging-retention/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://management_bot:management_bot@postgres:5432/management_bot
    depends_on:
      migrate:
        condition: service_completed_successfully

  dashboard-web:
    build:
      context: .
      dockerfile: apps/dashboard-web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    depends_on:
      - dashboard-api

  caddy:
   image: caddy:2-alpine
   restart: unless-stopped
   ports:
     - "80:80"
     - "443:443"
     - "443:443/udp"
   volumes:
     - ./Caddyfile:/etc/caddy/Caddyfile:ro
     - caddy-data:/data
     - caddy-config:/config
   depends_on:
     - dashboard-web
     - dashboard-api

volumes:
  postgres-data:
  redis-data:
  backup-data:
  caddy-data:
  caddy-config:
