server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # デプロイ後に古いアセット参照のindex.htmlを使い続けないよう毎回再検証させる(issue #549)。
    # SPAルートもtry_filesの内部リダイレクトでここに入る。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
